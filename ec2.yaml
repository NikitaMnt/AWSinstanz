AWSTemplateFormatVersion: '2010-09-09'
Description: Erzeugt eine t2.micro EC2-Instanz

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-07417cf949a60f5dd # Amazon Linux 2 AMI (Region: us-east-1)
      SecurityGroupIds: 	- sg-015e453168d0476c5
      Tags:
        - Key: Name
          Value: MeineEC2InstanzNikita
    
